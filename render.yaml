services:
  - type: web
    name: physioai-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "alembic upgrade head && python -m app.database.seeder && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        sync: false # Paste the Neon connection string in the Render Dashboard
      - key: GEMINI_API_KEY
        sync: false # Paste the Google AI Studio key in the Render Dashboard
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: SECRET_KEY
        generateValue: true
